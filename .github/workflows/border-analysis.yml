name: Border prediction analysis

# ボーダー予測の自己改善ジョブ（scripts/border/analyze.ts）。設計は docs/border-prediction.md。
#
# 終わったイベントの形を D1 に足し、前向き検証でモデルを選び直し、答え合わせを書く。
# リポジトリには何もコミットしない（書き込み先は Worker の管理 API 経由の D1 だけ）。
# ＝ Pages のビルドを走らせない。ビルドは無料枠で月500回しかない。

on:
  # 主に Worker（workers/border/src/dispatch.ts）が 22:45・10:45 JST に workflow_dispatch で起動する（2026-10-31。#183）。
  # 下の schedule は予備（Worker の鍵が切れたとき用）。重なって2回走っても結果は同じ（答え合わせは済んだ回を飛ばす）
  schedule:
    # 毎時の 0分・30分は GitHub が混んで遅れるので分をずらす（2026-10-13。9/29〜10/10 の実測で遅れの中央値は約6時間）
    # 22:47 JST（マラソンは 20:59 終了、sekai.best の最終サンプルは 21:15 ごろ）
    - cron: "47 13 * * *"
    # 10:47 JST（夜に失敗していたときの拾い直し。20:00 終了のワールドリンクもここで拾う）
    - cron: "47 1 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "30日より古い欠けも埋める（初回の投入用）"
        type: boolean
        default: false
      dry_run:
        description: "D1 に書かずに結果だけ見る"
        type: boolean
        default: false
      force_model:
        description: "関所で止まった版を、中身を確かめたうえで有効にする"
        type: boolean
        default: false

permissions:
  contents: read
  # 答え合わせのあと、Claude の改善案を Issue にする（scripts/claude/border-insight-run.ts）
  issues: write

concurrency:
  group: border-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 依存パッケージは使わない（Node の型除去で .ts をそのまま動かす）ので npm ci は要らない
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # ランナーに入っている 22 系は古いことがある（2026-10-25 時点で 22.23.3）。Brotli の修正（22.23.4）を確実に使うため最新を取る
          check-latest: true

      - name: Analyze
        env:
          BORDER_API: ${{ vars.BORDER_API }}
          BORDER_ADMIN_TOKEN: ${{ secrets.BORDER_ADMIN_TOKEN }}
          # ③ 一言解説・④ 改善案。鍵が無ければ飛ばす
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE_MODEL: ${{ inputs.force_model && '--force-model' || '' }}
          # 版の固定（リポジトリ変数）。名前を入れると、新しい版ができても有効にしない。空なら固定しない
          BORDER_MODEL_PIN: ${{ vars.BORDER_MODEL_PIN }}
        run: node scripts/border/analyze.ts $BACKFILL $DRY_RUN $FORCE_MODEL
