# カード・イベントの派生データを更新する。
#
# ★ 楽曲データ（refresh-music-data.yml）と分けてある。更新の周期が違うため。
#   こちらも JSON 3枚に加えてカードのサムネイル（thumb/）を取りに行くが、
#   **既にあるファイルは触らない**ので、実際に落ちるのは新しく解禁されたカードぶんだけ。
#
# ★ サムネイルは派生データに残ったカード（＝公開済み）だけを起点に取りに行く。
#   未公開カードのアセットは要求もしない（要求ログ自体が痕跡になるため）。
#
# ★ 頻度の理由: 解禁前のカードは「ビルド時刻」で切っている（先読みの猶予を入れない）。
#   1日1回だと 15:00 解禁のカードが翌朝まで出ないので、6時間おきにして遅れを詰める。
#   **早く出るくらいなら遅れる方を選ぶ**という原則は変えない。
name: Refresh card data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 未公開データの痕跡が残っていれば、このスクリプト自身が非ゼロで落ちる。
      - name: Refresh
        run: npm run data:refresh-cards

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/CardDatas/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "カードデータに差分なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/CardDatas/
          fi

      # ★★ ここが門番。未公開データの遮断のテストを含む。赤ければ main に入れない。
      #    （生成スクリプト自身も、痕跡を見つけたら書き出さずに落ちる）
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      # ★★ 以前は PR を立てていた（レビュー無しで本番へ出したくなかった）。だが
      #    **org 側の設定で「GitHub Actions による PR 作成」が禁止**されていて、
      #    その一点だけで毎回失敗し、データが止まっていた（2026-08-02 に発覚）。
      #    リポジトリ設定では解除できない（org 管理権限が要る）。
      #    → 直接コミットに切り替え、**テストとビルドを門番にする**。
      #      org 設定を変えられるようになったら PR 方式に戻してよい。
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 触るのは公開データだけ。他の差分は巻き込まない。
          git add public/CardDatas/
          git commit -m "chore(data): カード・イベントの派生データを更新"
          # ★ 走っている間に main が進んでいることがある（楽曲側の更新と同時刻に
          #   走ると実際にぶつかった）。取り込み直して数回やり直す。
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "push した（試行 $i 回目）"
              exit 0
            fi
            echo "競合したのでやり直す（試行 $i 回目）"
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::main への push に繰り返し失敗した"
          exit 1
