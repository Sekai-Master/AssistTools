name: Refresh music data

# 楽曲マスタ（Sekai-World/sekai-master-db-diff・sekai.best）を取り込み、
# 差分があれば main へ直接コミットする。
#
# ★★ 以前は PR を立てていた（人が見てからマージしたかった）。だが **org 側の設定で
#    「GitHub Actions による PR 作成」が禁止**されていて、その一点だけで毎回失敗し、
#    データが数日止まっていた（2026-08-02 に発覚）。リポジトリ設定では解除できない
#    （org 管理権限が要る）。
#    → 直接コミットに切り替え、**代わりにテストとビルドを門番にする**。
#      壊れたデータ・型の合わないデータはここで止まる。要約は実行ログに残す。
#      org 設定を変えられるようになったら PR 方式に戻してよい。
#
# 日次で回す理由:
#   refresh-music-data.js は `published = publishedAt <= now` を実行時に焼き込む。
#   未公開曲は published:false になってアプリ側で除外されるが、この判定は
#   スナップショット作成時点で固定されるため、公開日を跨いでも自動では true にならない。
#   日次で回しておけば、公開の翌日には反映される。

on:
  schedule:
    # 03:00 JST（= 18:00 UTC）。イベント開始の 20:00 JST より後、朝より前。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 差分の中身を PR 本文に出すため、更新前のスナップショットを退避しておく。
      - name: Snapshot current data
        run: cp public/MusicDatas/transformedMusics.json /tmp/before.json

      - name: Refresh
        run: npm run data:refresh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/MusicDatas/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "楽曲データに差分なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/MusicDatas/
          fi

      # 曲数の増減と、追加・公開状態が変わった曲を洗い出す。
      # ★ PR 本文の代わりに**実行ログとコミット本文**に残す（後から追える）。
      - name: Summarize
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/summarize-music-diff.mjs /tmp/before.json public/MusicDatas/transformedMusics.json > /tmp/summary.md
          cat /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      # ★ ここが門番。壊れたデータ・型の合わないデータは main に入れない。
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 触るのは公開データだけ。他の差分は巻き込まない。
          git add public/MusicDatas/
          git commit -F - <<EOF
          chore(data): 楽曲マスタを更新

          $(cat /tmp/summary.md)
          EOF
          # ★ 走っている間に main が進んでいることがある（カード側の更新と同時刻に
          #   走ると実際にぶつかった）。取り込み直して数回やり直す。
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "push した（試行 $i 回目）"
              exit 0
            fi
            echo "競合したのでやり直す（試行 $i 回目）"
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::main への push に繰り返し失敗した"
          exit 1
