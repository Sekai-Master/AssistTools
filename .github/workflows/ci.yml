name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ★ 警告では落とさない。react-hooks v7 の新規則ぶんが warn で残っているので、
      #   そこで赤くすると「赤いのが普通」になって門番の意味が消える。
      #   エラーだけを止める。
      - name: Lint
        run: npm run lint
