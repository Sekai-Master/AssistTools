name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # ★ 警告では落とさない。react-hooks v7 の新規則ぶんが warn で残っているので、
      #   そこで赤くすると「赤いのが普通」になって門番の意味が消える。
      #   エラーだけを止める。
      - name: Lint
        run: npm run lint

      # ── 本番デプロイ（Cloudflare Pages）────────────────────────────
      # ここまでの test / build / lint が全部通ったときだけ走る。Netlify は
      # push したら無条件でビルドしていたので、壊れたものがそのまま出ていた。
      # 同じジョブに置いているのは、上の Build が作った dist をそのまま出すため
      #（artifact 経由にすると 4,900 ファイルの往復で遅くなるだけ）。
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sekaimaster --branch=main
