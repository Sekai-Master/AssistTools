name: CI

on:
  push:
    branches: [main]
  pull_request:

  # ★ データ更新ワークフローの commit は GITHUB_TOKEN で push される。
  #   GitHub は再帰防止のため、その push では **他のワークフローを起動しない**。
  #   Netlify 時代はサイト側の Git 連携が直接デプロイしていたので影響が無かったが、
  #   デプロイを CI 経由にした以上、ここを繋がないと日次のカード更新が本番に届かない
  #   （実際に届いていなかった。2026-08-03 に発覚）。
  workflow_run:
    workflows: ["Refresh card data", "Refresh music data"]
    types: [completed]

jobs:
  check:
    runs-on: ubuntu-latest
    # データ更新が失敗した回にまでデプロイを走らせない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Cloudflare Web Analytics のビーコン。公開前提の値なので secrets ではなく
          # variables に置く。未設定ならビーコンごと差し込まれない（vite.config.ts）。
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      # ★ 警告では落とさない。react-hooks v7 の新規則ぶんが warn で残っているので、
      #   そこで赤くすると「赤いのが普通」になって門番の意味が消える。
      #   エラーだけを止める。
      - name: Lint
        run: npm run lint

      # ── 本番デプロイ（Cloudflare Pages）────────────────────────────
      # ここまでの test / build / lint が全部通ったときだけ走る。Netlify は
      # push したら無条件でビルドしていたので、壊れたものがそのまま出ていた。
      # 同じジョブに置いているのは、上の Build が作った dist をそのまま出すため
      #（artifact 経由にすると 4,900 ファイルの往復で遅くなるだけ）。
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sekaimaster --branch=main
