<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 347.05" width="100%" role="img" aria-label="図2 協力ライブのスキル発動の順。1〜5 回目は参加者 5 人がランダムな順で 1 回ずつ、6 回目のアンコールは直前にスコアが最も高い人。各回に乗るのは担当した人の実効値"><style>
.gf-t{font-family:"M PLUS Rounded 1c",ui-sans-serif,system-ui,sans-serif;fill:var(--neu-ink,#333)}
.gf-m{fill:var(--color-slate-500,#64748b)}
.gf-b{font-weight:700}
.gf-box{fill:var(--neu-hi,#fff);stroke:var(--color-slate-300,#cbd5e1);stroke-width:1}
.gf-soft{fill:var(--color-slate-100,#f1f5f9)}
.gf-ac{fill:var(--color-ln,#4455dd)}
.gf-acs{stroke:var(--color-ln,#4455dd)}
.gf-acbox{fill:var(--neu-hi,#fff);stroke:var(--color-ln,#4455dd);stroke-width:2}
.gf-ln{stroke:var(--color-slate-400,#94a3b8);stroke-width:1.5;fill:none}
.gf-grid{stroke:var(--color-slate-200,#e2e8f0);stroke-width:1}
.gf-dash{stroke-dasharray:4 3}
</style><text x="8" y="20" font-size="13" text-anchor="start" class="gf-t gf-b">協力ライブ 1 曲のスキルの発動（6 か所）</text><rect x="14" y="34" width="62" height="54" rx="10" class="gf-box"/><text x="45" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">1 回目</text><text x="45" y="76" font-size="14" text-anchor="middle" class="gf-t gf-b">C さん</text><rect x="84" y="34" width="62" height="54" rx="10" class="gf-box"/><text x="115" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">2 回目</text><text x="115" y="76" font-size="14" text-anchor="middle" class="gf-t gf-b">A さん</text><rect x="154" y="34" width="62" height="54" rx="10" class="gf-box"/><text x="185" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">3 回目</text><text x="185" y="76" font-size="14" text-anchor="middle" class="gf-t gf-b">E さん</text><rect x="224" y="34" width="62" height="54" rx="10" class="gf-box"/><text x="255" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">4 回目</text><text x="255" y="76" font-size="14" text-anchor="middle" class="gf-t gf-b">B さん</text><rect x="294" y="34" width="62" height="54" rx="10" class="gf-box"/><text x="325" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">5 回目</text><text x="325" y="76" font-size="14" text-anchor="middle" class="gf-t gf-b">D さん</text><rect x="364" y="34" width="62" height="54" rx="10" class="gf-acbox"/><text x="395" y="54" font-size="11.5" text-anchor="middle" class="gf-t gf-m">6 回目</text><text x="395" y="76" font-size="11" text-anchor="middle" class="gf-t gf-b">アンコール</text><path d="M14 98 v6 H356 v-6" class="gf-ln"/><text x="8" y="124" font-size="12" text-anchor="start" class="gf-t ">1〜5 回目: 参加者 5 人が 1 回ずつ。順はランダム</text><text x="8" y="142" font-size="11.5" text-anchor="start" class="gf-t gf-m">（2023 年 7 月の v2.7.5 から）〔プレイヤーの間で〕</text><text x="8" y="166" font-size="12" text-anchor="start" class="gf-t ">6 回目（アンコール）: 直前にスコアがいちばん高い人が</text><text x="8" y="184" font-size="11.5" text-anchor="start" class="gf-t gf-m">もう 1 回〔走っている人の実感〕</text><text x="8" y="208" font-size="12" text-anchor="start" class="gf-t ">各回に乗るのは、その回を担当した人の実効値〔このサイトの計算〕</text><rect x="8" y="220" width="424" height="81.05000000000001" rx="10" class="gf-box"/><text x="20" y="248.25" font-size="13" text-anchor="start" class="gf-t gf-b">実効値 ＝ 先頭 ＋（内部値 − 先頭）× 0.2</text><text x="20" y="267.825" font-size="11.5" text-anchor="start" class="gf-t gf-m">先頭: リーダーのスキル値　内部値: リーダーを含む 5 枚の合計</text><text x="20" y="288.05" font-size="12.5" text-anchor="start" class="gf-t ">例: 先頭 150・内部値 710 → 150 ＋ 560 × 0.2 ＝ 262</text><text x="8" y="321.05" font-size="11" text-anchor="start" class="gf-t gf-m">発動の順・アンコールの決まり方・0.2 の係数は、どれも公式の説明は</text><text x="8" y="337.05" font-size="11" text-anchor="start" class="gf-t gf-m">見当たりません。ひとりでライブは 5 枚が 1 回ずつ＋最後にリーダーがもう 1 回</text></svg>
