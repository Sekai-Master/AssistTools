<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 475.20000000000005" width="100%" role="img" aria-label="図6 募集の文の部品。ルームの種類・曲・回数と残り枠、ルーム ID、主、募、ひとこと、ハッシュタグの順"><style>
.gf-t{font-family:"M PLUS Rounded 1c",ui-sans-serif,system-ui,sans-serif;fill:var(--neu-ink,#333)}
.gf-m{fill:var(--color-slate-500,#64748b)}
.gf-b{font-weight:700}
.gf-box{fill:var(--neu-hi,#fff);stroke:var(--color-slate-300,#cbd5e1);stroke-width:1}
.gf-soft{fill:var(--color-slate-100,#f1f5f9)}
.gf-ac{fill:var(--color-ln,#4455dd)}
.gf-acs{stroke:var(--color-ln,#4455dd)}
.gf-acbox{fill:var(--neu-hi,#fff);stroke:var(--color-ln,#4455dd);stroke-width:2}
.gf-ln{stroke:var(--color-slate-400,#94a3b8);stroke-width:1.5;fill:none}
.gf-grid{stroke:var(--color-slate-200,#e2e8f0);stroke-width:1}
.gf-dash{stroke-dasharray:4 3}
</style><text x="8" y="22" font-size="13" text-anchor="start" class="gf-t gf-b">例: ついぼジェネレーターで組んだ募集の文</text><rect x="8" y="34" width="424" height="53.6" rx="10" class="gf-box gf-dash"/><text x="17" y="59.25" font-size="13" text-anchor="start" class="gf-t gf-b">@No_TL</text><text x="17" y="78.2" font-size="11" text-anchor="start" class="gf-t gf-m">付けるとタイムラインに出ない（付けないことも多い）〔プレイヤーの間で〕</text><rect x="8" y="93.6" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="118.85" font-size="13" text-anchor="start" class="gf-t gf-b">ベテラン エビ高速周回　@2</text><text x="17" y="137.8" font-size="11" text-anchor="start" class="gf-t gf-m">ルームの種類・曲・回数。@2 は残りの募集人数〔プレイヤーの間で〕</text><rect x="8" y="153.2" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="178.45" font-size="13" text-anchor="start" class="gf-t gf-b">【ルームID：12345】</text><text x="17" y="197.39999999999998" font-size="11" text-anchor="start" class="gf-t gf-m">入る部屋の番号</text><rect x="8" y="212.79999999999998" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="238.04999999999998" font-size="13" text-anchor="start" class="gf-t gf-b">主：150%</text><text x="17" y="257" font-size="11" text-anchor="start" class="gf-t gf-m">募集した人の編成。% はリーダーのスキル値〔プレイヤーの間で〕</text><rect x="8" y="272.4" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="297.65" font-size="13" text-anchor="start" class="gf-t gf-b">募：140%↑　SFC気にしません・途中抜けOK</text><text x="17" y="316.59999999999997" font-size="11" text-anchor="start" class="gf-t gf-m">入ってほしい人の条件。↑ は「以上」〔プレイヤーの間で〕</text><rect x="8" y="332" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="357.25" font-size="13" text-anchor="start" class="gf-t gf-b">集まるまで待てる方</text><text x="17" y="376.2" font-size="11" text-anchor="start" class="gf-t gf-m">ひとこと</text><rect x="8" y="391.6" width="424" height="53.6" rx="10" class="gf-box"/><text x="17" y="416.85" font-size="13" text-anchor="start" class="gf-t gf-b">#プロセカ募集 #プロセカ協力</text><text x="17" y="435.8" font-size="11" text-anchor="start" class="gf-t gf-m">ハッシュタグ</text><text x="8" y="465.20000000000005" font-size="11" text-anchor="start" class="gf-t gf-m">1 行目の @No_TL は入れないこともできる（点線）。エビは曲の略</text></svg>
