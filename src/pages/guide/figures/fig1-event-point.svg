<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 686.1" width="100%" role="img" aria-label="図1 イベントポイントの決まり方。スコアからスコア係数を出し、イベントボーナス、基礎点、ライボの倍率を順に掛ける"><style>
.gf-t{font-family:"M PLUS Rounded 1c",ui-sans-serif,system-ui,sans-serif;fill:var(--neu-ink,#333)}
.gf-m{fill:var(--color-slate-500,#64748b)}
.gf-b{font-weight:700}
.gf-box{fill:var(--neu-hi,#fff);stroke:var(--color-slate-300,#cbd5e1);stroke-width:1}
.gf-soft{fill:var(--color-slate-100,#f1f5f9)}
.gf-ac{fill:var(--color-ln,#4455dd)}
.gf-acs{stroke:var(--color-ln,#4455dd)}
.gf-acbox{fill:var(--neu-hi,#fff);stroke:var(--color-ln,#4455dd);stroke-width:2}
.gf-ln{stroke:var(--color-slate-400,#94a3b8);stroke-width:1.5;fill:none}
.gf-grid{stroke:var(--color-slate-200,#e2e8f0);stroke-width:1}
.gf-dash{stroke-dasharray:4 3}
</style><rect x="100" y="8" width="240" height="41.45" rx="10" class="gf-box"/><text x="220" y="36.25" font-size="13" text-anchor="middle" class="gf-t gf-b">1 回のライブのスコア</text><line x1="220" y1="51.45" x2="220" y2="64.45" class="gf-ln"/><path d="M215 62.45 L220 69.45 L225 62.45" class="gf-ln"/><rect x="8" y="71.45" width="424" height="164.37499999999997" rx="10" class="gf-box"/><text x="20" y="99.7" font-size="13" text-anchor="start" class="gf-t gf-b">スコア係数</text><text x="20" y="119.9" font-size="12" text-anchor="start" class="gf-t gf-m">ひとりでライブ・オート</text><text x="32" y="140.95" font-size="13" text-anchor="start" class="gf-t ">100 ＋ スコア ÷ 20,000</text><text x="20" y="161.15" font-size="12" text-anchor="start" class="gf-t gf-m">協力ライブ</text><text x="32" y="182.2" font-size="13" text-anchor="start" class="gf-t ">110 ＋ 自分のスコア ÷ 17,000</text><text x="32" y="203.64999999999998" font-size="13" text-anchor="start" class="gf-t ">＋ ほかの 4 人のスコアの合計 ÷ 340,000（16 まで）</text><text x="20" y="223.22499999999997" font-size="11.5" text-anchor="start" class="gf-t gf-m">割り算は、それぞれ小数を切り捨てる</text><line x1="220" y1="237.825" x2="220" y2="250.825" class="gf-ln"/><path d="M215 248.825 L220 255.825 L225 248.825" class="gf-ln"/><rect x="8" y="257.825" width="424" height="60.425000000000004" rx="10" class="gf-box"/><text x="20" y="286.075" font-size="13" text-anchor="start" class="gf-t gf-b">×（100 ＋ イベントボーナス%）÷ 100</text><text x="20" y="305.65" font-size="11.5" text-anchor="start" class="gf-t gf-m">小数第 2 位から下を切り捨てる</text><line x1="220" y1="320.25" x2="220" y2="333.25" class="gf-ln"/><path d="M215 331.25 L220 338.25 L225 331.25" class="gf-ln"/><rect x="8" y="340.25" width="424" height="60.425000000000004" rx="10" class="gf-box"/><text x="20" y="368.5" font-size="13" text-anchor="start" class="gf-t gf-b">× 基礎点 ÷ 100</text><text x="20" y="388.075" font-size="11.5" text-anchor="start" class="gf-t gf-m">小数を切り捨てる。基礎点は曲ごとに決まり、難易度では変わらない</text><line x1="220" y1="402.675" x2="220" y2="415.675" class="gf-ln"/><path d="M215 413.675 L220 420.675 L225 413.675" class="gf-ln"/><rect x="8" y="422.675" width="424" height="60.425000000000004" rx="10" class="gf-box"/><text x="20" y="450.925" font-size="13" text-anchor="start" class="gf-t gf-b">× ライボの倍率</text><text x="20" y="470.5" font-size="11.5" text-anchor="start" class="gf-t gf-m">0 炊き 1 倍・5 炊き 25 倍・10 炊き 35 倍（図5）</text><line x1="220" y1="485.1" x2="220" y2="498.1" class="gf-ln"/><path d="M215 496.1 L220 503.1 L225 496.1" class="gf-ln"/><rect x="100" y="505.1" width="240" height="41.45" rx="10" class="gf-acbox"/><text x="220" y="533.35" font-size="13" text-anchor="middle" class="gf-t gf-b">獲得するイベントポイント</text><rect x="8" y="560.5500000000001" width="424" height="97.55" rx="10" class="gf-soft"/><text x="20" y="587.5500000000001" font-size="12" text-anchor="start" class="gf-t gf-b">例（ひとりでライブ・1 炊き）</text><text x="20" y="607.35" font-size="12" text-anchor="start" class="gf-t ">スコア 1,376,057 → 係数 168 → × 4.95 ＝ 831.6</text><text x="20" y="627.1500000000001" font-size="12" text-anchor="start" class="gf-t ">→ × 基礎点 112 ÷ 100 ＝ 931（切り捨て）→ × 5 ＝ 4,655 P</text><text x="20" y="645.7" font-size="11" text-anchor="start" class="gf-t gf-m">ゲームの結果の画面の 4,655 P と一致</text><text x="8" y="678.1" font-size="11" text-anchor="start" class="gf-t gf-m">計算の順と式は〔このサイトの計算〕、ライボの倍率は〔ゲームのデータ〕</text></svg>
