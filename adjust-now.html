<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>着地アナライザー（即応版）</title>
<style>
:root{color-scheme:dark}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:12px;background:#0f1115;color:#e7e9ee}
h1{font-size:17px;margin:0 0 10px}
.card{background:#171a21;border:1px solid #262b36;border-radius:10px;padding:12px;margin-bottom:10px}
label{display:block;font-size:12px;color:#9aa3b2;margin-bottom:4px}
input{width:100%;box-sizing:border-box;font-size:22px;padding:10px;border-radius:8px;border:1px solid #333a48;background:#0d0f14;color:#e7e9ee;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}.row>div{flex:1}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.ok{color:#4ade80}.bad{color:#f87171}
.muted{color:#9aa3b2;font-size:12px}
.plan{border:1px solid #2b3240;border-radius:8px;padding:9px;margin:7px 0;background:#12151b}
.plan.top{border-color:#4ade80}
.hd{display:flex;justify-content:space-between;font-size:12px;color:#9aa3b2;margin-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:3px 4px;border-bottom:1px solid #222835;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sng{font-weight:600}.alt{color:#7c869a;font-size:11px}
.tag{display:inline-block;background:#1f2836;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px}
#selftest{font-size:11px;padding:5px 8px;border-radius:6px;margin-bottom:8px}
</style></head><body>
<div id="selftest"></div>
<h1>着地アナライザー — 即応版</h1>

<div class="card">
  <label>現在ポイント（周回を止めた時点の実測値）</label>
  <input id="cur" inputmode="numeric" placeholder="例 157120383" autofocus>
  <div class="row" style="margin-top:8px">
    <div><label>目標</label><input id="tgt" inputmode="numeric" value="157200525" style="font-size:15px"></div>
    <div><label>スコア上限</label><input id="cap" inputmode="numeric" value="1100000" style="font-size:15px"></div>
  </div>
  <div class="muted" style="margin-top:6px">イベントボーナス 990% 固定 / マイセカイ・最終楽曲なし</div>
</div>

<div class="card">
  <div class="muted">残り（これをちょうど作る）</div>
  <div id="rem" class="big">&mdash;</div>
  <div id="note" class="muted"></div>
</div>

<div id="out"></div>

<script>
const SONGS = {"114": [{"t": "ローリンガール", "s": 120.9}, {"t": "Awake Now", "s": 121.6}, {"t": "キャットフード", "s": 121.9}, {"t": "古書屋敷殺人事件", "s": 122}, {"t": "熱異常", "s": 122}], "109": [{"t": "我らステインバスターズ！", "s": 104.9}, {"t": "Peaky Peaky", "s": 105.5}, {"t": "マトリョシカ", "s": 106}, {"t": "Iなんです", "s": 106.1}, {"t": "アイスドロップ", "s": 106.4}], "112": [{"t": "ワンスアポンアドリーム", "s": 112.8}, {"t": "メインキャラクター", "s": 115.2}, {"t": "いかないで", "s": 115.7}, {"t": "陽だまりのセツナ", "s": 115.7}, {"t": "脳天", "s": 115.8}], "105": [{"t": "幽光、1/fのゆらめき", "s": 91.2}, {"t": "パラソルサイダー", "s": 91.4}, {"t": "悪ノ娘", "s": 91.5}, {"t": "ノマド", "s": 91.7}, {"t": "Ready Steady", "s": 92.2}], "116": [{"t": "チルノのパーフェクトさんすう学園", "s": 127}, {"t": "M@GICAL☆CURE! LOVE ♥ SHOT!", "s": 129}, {"t": "Saika", "s": 129.1}, {"t": "Flyway", "s": 129.2}, {"t": "バレリーコ", "s": 129.2}], "106": [{"t": "ODDS＆ENDS", "s": 93.8}, {"t": "ビバハピ", "s": 94}, {"t": "虚無さん", "s": 94.2}, {"t": "スマイル*シンフォニー", "s": 94.3}, {"t": "そこに在る、光。", "s": 96.4}], "113": [{"t": "踊れオーケストラ", "s": 109.7}, {"t": "青く駆けろ！", "s": 116.9}, {"t": "天使のクローバー", "s": 118.4}, {"t": "39みゅーじっく！", "s": 119.1}, {"t": "旅に帰る", "s": 119.1}], "108": [{"t": "Call!!", "s": 101.7}, {"t": "ダンスロボットダンス", "s": 101.9}, {"t": "悪食娘コンチータ", "s": 102}, {"t": "limbo", "s": 102}, {"t": "フューエル", "s": 102.3}], "120": [{"t": "アイノマテリアル", "s": 124}, {"t": "ゴーストルール", "s": 142.1}, {"t": "恋は戦争", "s": 143}, {"t": "絶え間なく藍色", "s": 143.1}, {"t": "39", "s": 143.3}], "107": [{"t": "オールセーブチャレンジ", "s": 96.7}, {"t": "Booo!", "s": 97.7}, {"t": "イレヴンス", "s": 98.1}, {"t": "「１」", "s": 98.2}, {"t": "群青讃歌", "s": 99}], "121": [{"t": "フロイライン＝ビブリォチカ", "s": 145.6}, {"t": "Blue Star", "s": 147.1}, {"t": "Change me", "s": 147.2}, {"t": "エゴイスト", "s": 147.4}, {"t": "神っぽいな", "s": 147.5}], "115": [{"t": "イガク", "s": 120.7}, {"t": "あちこちデートさん", "s": 122}, {"t": "モア！ジャンプ！モア！", "s": 123.6}, {"t": "私は雨", "s": 125}, {"t": "導火愛", "s": 126.1}], "130": [{"t": "メルト", "s": 182.1}, {"t": "初音天地開闢神話", "s": 182.4}, {"t": "周年記念高難易度書き下ろし楽曲メドレー", "s": 279}, {"t": "初音ミクの激唱", "s": 299.7}, {"t": "MASTER高難易度楽曲メドレー", "s": 315.7}], "128": [{"t": "ワールドイズマイン", "s": 170.8}], "119": [{"t": "ガランド", "s": 130.7}, {"t": "夜咄ディセイブ", "s": 140}, {"t": "愛されなくても君がいる", "s": 140.1}, {"t": "RAD DOGS", "s": 140.2}, {"t": "どりーみんチュチュ", "s": 140.2}], "111": [{"t": "magic number", "s": 111}, {"t": "the WALL", "s": 111.8}, {"t": "エゴロック", "s": 112.3}, {"t": "とうほう☆ワンダーランド", "s": 112.3}, {"t": "チームメイト", "s": 112.4}], "110": [{"t": "みくみくにしてあげる♪【してやんよ】", "s": 100.9}, {"t": "アイドル新鋭隊", "s": 106}, {"t": "星空のメロディー", "s": 108.4}, {"t": "くうになる", "s": 108.7}, {"t": "ショウタイム・ルーラー", "s": 108.9}], "118": [{"t": "アイディスマイル", "s": 135.1}, {"t": "ブループラネット", "s": 135.9}, {"t": "うっせぇわ", "s": 136.2}, {"t": "阿吽のビーツ", "s": 136.4}, {"t": "アンノウン・マザーグース", "s": 136.7}], "103": [{"t": "ジャックポットサッドガール", "s": 83.5}, {"t": "心拍ペアリング", "s": 87.3}], "104": [{"t": "ファイアダンス", "s": 91.5}, {"t": "ブレス・ユア・ブレス", "s": 94.9}], "100": [{"t": "独りんぼエンヴィー", "s": 74.8}], "117": [{"t": "神のまにまに", "s": 132.9}, {"t": "幽霊東京", "s": 133.1}, {"t": "リモコン", "s": 133.2}, {"t": "マシュマリー", "s": 133.2}, {"t": "パレットには君がいっぱい", "s": 133.5}], "123": [{"t": "とても素敵な六月でした", "s": 154}, {"t": "0.0000034", "s": 154.3}, {"t": "ÅMARA(大未来電脳)", "s": 154.5}, {"t": "拝啓ドッペルゲンガー", "s": 155.2}, {"t": "セツナトリップ", "s": 155.2}], "124": [{"t": "君色マリンスノウ", "s": 151.8}, {"t": "虚ろを扇ぐ", "s": 156.6}, {"t": "新人類", "s": 156.7}, {"t": "月光", "s": 157}, {"t": "SnowMix♪", "s": 158.4}], "122": [{"t": "私の恋はヘルファイア", "s": 150.3}, {"t": "Dear", "s": 150.4}, {"t": "ダイジョブですか？", "s": 150.6}, {"t": "Sharing The World", "s": 150.7}, {"t": "Sage", "s": 150.7}], "126": [{"t": "Journey", "s": 166}, {"t": "ずんだパーリナイ", "s": 166.8}], "127": [{"t": "天使の翼。", "s": 169.2}], "125": [{"t": "相生", "s": 161.6}, {"t": "おどロボ", "s": 163.9}]};
const BONUS = 990;
const MULT = {0:1,1:5,2:10,3:15,4:20,5:25,6:27,7:29,8:31,9:33,10:35};
const OVERHEAD = 47;

// 本体 calcLivePt と全数一致を検証済みの実装
function calcLivePt(base, bonus, score, lb){
  const s1 = Math.floor(score / 20000);
  const b100 = Math.round(bonus * 100);
  const s2 = Math.floor(((s1 + 100) * (b100 + 10000)) / 1000);
  const s3 = Math.floor((s2 * base) / 1000);
  return s3 * (MULT[lb] || 1);
}

(function(){
  const cases=[[107,0,0,1166],[100,0,10,38150],[100,1100000,10,59115],[130,1100000,10,76860],[107,1100000,10,63245]];
  const bad=cases.filter(function(c){return calcLivePt(c[0],BONUS,c[1],c[2])!==c[3];});
  const el=document.getElementById('selftest');
  if(bad.length){el.className='bad';el.style.background='#3b1418';el.textContent='⚠ 計算式セルフテスト失敗 — 使用しないでください';}
  else {el.className='ok';el.style.background='#12261a';el.textContent='✓ 計算式セルフテスト通過（既知5値と一致）';}
})();

const BASES = Object.keys(SONGS).map(Number).sort(function(a,b){return a-b;});

function buildReps(capScore){
  const maxN = Math.min(Math.floor(capScore/20000), 200);
  const map = new Map();
  for(const base of BASES)
    for(let lb=0; lb<=10; lb++)
      for(let n=0; n<=maxN; n++){
        const pt = calcLivePt(base, BONUS, n*20000, lb);
        if(pt<=0) continue;
        let a = map.get(pt);
        if(!a){ a=[]; map.set(pt,a); }
        if(a.length<8) a.push({base:base,lb:lb,n:n,pt:pt});
      }
  return map;
}

function planTime(units){
  let t=0;
  for(const u of units){ const l=SONGS[u.base]; t += ((l&&l[0])?l[0].s:90) + OVERHEAD; }
  return Math.round(t);
}
function fmt(n){ return n.toLocaleString('ja-JP'); }

function render(){
  const cur = parseInt((document.getElementById('cur').value||'').replace(/[^0-9]/g,''),10);
  const tgt = parseInt((document.getElementById('tgt').value||'').replace(/[^0-9]/g,''),10);
  const cap = parseInt((document.getElementById('cap').value||'').replace(/[^0-9]/g,''),10) || 1100000;
  const remEl=document.getElementById('rem'), noteEl=document.getElementById('note'), out=document.getElementById('out');
  out.innerHTML='';
  if(!cur || !tgt){ remEl.textContent='—'; remEl.className='big'; noteEl.textContent=''; return; }
  const R = tgt - cur;
  remEl.textContent = fmt(R);
  if(R < 0){ remEl.className='big bad'; noteEl.textContent='⚠ 目標を超過しています。着地不能。'; return; }
  if(R === 0){ remEl.className='big ok'; noteEl.textContent='ちょうど目標です。調整不要。'; return; }
  if(R < 6808){
    remEl.className='big bad';
    noteEl.className='bad';
    noteEl.textContent = (R<1090)
      ? '⚠ 危険域：1,090未満は1本の最小値を下回るため、確実に着地不能です。'
      : '⚠ 危険域（6,808未満）：この帯には作れない値が多数あります。解が0件なら着地できません。';
  } else {
    remEl.className='big ok';
    noteEl.className='muted';
    noteEl.textContent='安全域（6,808以上）。スコアは表示帯（2万点幅）のどこでも同じ結果';
  }

  const reps = buildReps(cap);
  const vals = Array.from(reps.keys()).sort(function(a,b){return a-b;});
  const plans = [];

  if(reps.has(R)) for(const r of reps.get(R)) plans.push([r]);

  for(const v of vals){
    if(v*2 > R) break;
    const r = R - v;
    if(!reps.has(r)) continue;
    const A=reps.get(v), B=reps.get(r);
    for(let i=0;i<A.length && i<3;i++)
      for(let j=0;j<B.length && j<3;j++){
        if(v===r && j<i) continue;
        plans.push([A[i],B[j]]);
      }
    if(plans.length>4000) break;
  }

  if(plans.length===0){
    outer:
    for(let x=vals.length-1;x>=0;x--){
      const v1=vals[x]; if(v1>=R) continue;
      const rest=R-v1;
      for(const v2 of vals){
        if(v2>rest) break;
        const v3=rest-v2;
        if(reps.has(v3)){
          plans.push([reps.get(v1)[0],reps.get(v2)[0],reps.get(v3)[0]]);
          if(plans.length>60) break outer;
        }
      }
    }
  }

  if(plans.length===0){
    out.innerHTML='<div class="card bad">この残額を作れる組み合わせが見つかりませんでした。スコア上限を上げるか、周回を１回追加してください。</div>';
    return;
  }

  const valid = plans.filter(function(p){
    return p.reduce(function(s,u){return s+u.pt;},0) === R;
  });

  valid.sort(function(a,b){
    return a.length-b.length || planTime(a)-planTime(b)
      || a.reduce(function(s,u){return s+u.lb;},0)-b.reduce(function(s,u){return s+u.lb;},0);
  });

  const seen={}, show=[];
  for(const p of valid){
    const k=p.map(function(u){return u.base+'/'+u.lb+'/'+u.n;}).sort().join('|');
    if(seen[k]) continue; seen[k]=1; show.push(p);
    if(show.length>=60) break;
  }

  const h=[];
  h.push('<div class="card"><b>'+valid.length.toLocaleString()+'通り</b>の解が見つかりました（本数が少なく短い順に'+show.length+'件表示）</div>');
  show.forEach(function(p,idx){
    const lbT=p.reduce(function(s,u){return s+u.lb;},0);
    const sum=p.reduce(function(s,u){return s+u.pt;},0);
    const t=planTime(p);
    h.push('<div class="plan'+(idx===0?' top':'')+'">');
    h.push('<div class="hd"><span><span class="tag">'+p.length+'本</span><span class="tag">約'+t+'秒</span><span class="tag">LB計'+lbT+'</span></span><span>#'+(idx+1)+'</span></div>');
    h.push('<table>');
    for(const u of p){
      const lo=u.n*20000, hi=lo+19999, list=SONGS[u.base]||[];
      const main=list[0]?(list[0].t+'（'+list[0].s+'秒）'):('基礎点'+u.base);
      const alts=list.slice(1,3).map(function(x){return x.t+'('+x.s+'s)';}).join(' / ');
      h.push('<tr><td><span class="sng">'+main+'</span><br><span class="alt">基礎点'+u.base+(alts?' ｜他: '+alts:'')+'</span></td>'
        +'<td class="n">LB'+u.lb+'</td>'
        +'<td class="n">'+fmt(lo)+'<br><span class="alt">〜'+fmt(hi)+'</span></td>'
        +'<td class="n"><b>'+fmt(u.pt)+'</b></td></tr>');
    }
    h.push('</table>');
    h.push('<div class="hd" style="margin:5px 0 0"><span class="'+(sum===R?'ok':'bad')+'">合計 '+fmt(sum)+(sum===R?' ✓ 厳密一致':' ✗ 不一致')+'</span><span>着地 '+fmt(cur+sum)+'</span></div>');
    h.push('</div>');
  });
  out.innerHTML=h.join('');
}
['cur','tgt','cap'].forEach(function(id){ document.getElementById(id).addEventListener('input', render); });
render();
</script></body></html>
