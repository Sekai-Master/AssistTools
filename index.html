<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sekai-Master</title>
    <meta name="description" content="プロセカをより楽しむためのツール集。ついぼ生成・スキル実効値・ポイント調整・BINGO など。" />
    <link rel="icon" type="image/webp" href="/images/icon.webp" />
    <link rel="icon" type="image/png" href="/images/icon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta property="og:title" content="Sekai-Master" />
    <meta property="og:description" content="プロセカをより楽しむためのツール集" />
    <meta property="og:image" content="/images/icon.png" />
    <!--
      テーマだけは CSS より先に確定させる。main.tsx は module なので CSS の後に
      走り、明示的にライト/ダークを選んでいる人は一瞬だけ端末側の配色が見える。
      ここで html[data-theme] を立てておけば最初の描画から正しい配色になる。
      ★ キー文字列は src/lib/theme.ts と同じもの。変えるなら両方。
    -->
    <script>
      try {
        var t = localStorage.getItem("sekaimaster:theme:v1");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {
        /* プライベートモード等。既定（端末追随）のままでよい */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
